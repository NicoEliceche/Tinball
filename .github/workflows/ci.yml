name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://tinball:tinball@localhost:5432/tinball
      DIRECT_URL: postgresql://tinball:tinball@localhost:5432/tinball
      SESSION_PEPPER: ci-session-pepper-at-least-thirty-two-characters
      AUDIT_HASH_SECRET: ci-audit-secret-at-least-thirty-two-characters
      IP_HASH_SECRET: ci-private-secret-at-least-thirty-two-characters
      GOOGLE_WEB_CLIENT_ID: ci.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run verify
      - run: npm run security:check
      - run: npx expo-doctor@latest
        working-directory: apps/mobile
      - run: npm run build:web
