name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - name: Export Expo web
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.TINBALL_API_URL }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          EXPO_PUBLIC_TERMS_URL: ${{ vars.EXPO_PUBLIC_TERMS_URL }}
          EXPO_PUBLIC_PRIVACY_URL: ${{ vars.EXPO_PUBLIC_PRIVACY_URL }}
          EXPO_PUBLIC_COMMUNITY_RULES_URL: ${{ vars.EXPO_PUBLIC_COMMUNITY_RULES_URL }}
        run: npm run build:web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/mobile/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
